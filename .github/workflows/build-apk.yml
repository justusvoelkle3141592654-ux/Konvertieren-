name: APK bauen

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle-Cache
        uses: gradle/actions/setup-gradle@v4

      - name: APK bauen
        run: ./gradlew --no-daemon assembleRelease

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk Hoerbuch-Konverter.apk

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Hoerbuch-Konverter-APK
          path: Hoerbuch-Konverter.apk

      - name: APK als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hoerbuch-apk
          name: "Hörbuch Konverter – neueste APK"
          body: |
            Automatisch gebaute APK des Hörbuch Konverters.
            Einfach `Hoerbuch-Konverter.apk` auf dem Handy herunterladen und installieren
            (Installation aus unbekannten Quellen erlauben).
          files: Hoerbuch-Konverter.apk
